services:
  - type: web
    name: hooklab
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false            # you paste it in the Render dashboard; never commit it
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: DATABASE_URL
        fromDatabase:
          name: hooklab-db
          property: connectionString
databases:
  - name: hooklab-db
    plan: free
